# Windows CI for the two workstreams: the Rust launcher (fmt/tests/release build) and the
# native runtime (the documented MSYS2 CLANG64 toolchain from packaging/windows/README.md).
# The standalone tests mirror the Linux-only `build.sh --test` block (build.sh exits after
# the MSYS build before reaching it).
name: Windows CI

on:
  push:
  pull_request:

jobs:
  rust-launcher:
    name: Rust launcher (fmt, tests, release)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: tests
        run: cargo test
      - name: release build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: uncharted-launcher-win
          path: rust-launcher/target/release/uncharted-launcher.exe
          if-no-files-found: error

  runtime-msys2:
    name: Runtime (MSYS2 CLANG64 build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Build the Windows runtime (build.sh, MSYS2 CLANG64)
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          bash build.sh
      - name: Standalone tests (same commands as the Linux-only build.sh --test block)
        shell: msys2 {0}
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror -pthread -I. -Isrc tests/test_file_mods.c -o out/file-mods-test
          out/file-mods-test
          clang -std=c11 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror -I. -Isrc tests/test_content.c src/runtime_content.c -o out/content-test
          out/content-test
          clang++ -std=c++20 -O0 -g -Wall -Wextra -Werror tests/test_coroutine_frames.cpp -o out/coroutine-frames-test
          out/coroutine-frames-test
      - name: Python test suite
        shell: msys2 {0}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          path: |
            out/bb-probe.exe
            out/bb-gpu-capabilities.exe
            out/bb-play.exe
          if-no-files-found: error
