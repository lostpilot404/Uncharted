# Windows CI for the two workstreams. Split into two workflows so each workstream
# branch can carry only its own validation:
#   rust-launcher.yml - the Rust launcher (fmt/tests/release build)
#   runtime.yml       - the native runtime (documented MSYS2 CLANG64 toolchain)
# Note: the standalone tests mirror the Linux-only `build.sh --test` block (build.sh
# exits after the MSYS build before reaching it).
name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-msys2:
    name: Runtime (MSYS2 CLANG64 build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Build the Windows runtime (build.sh, MSYS2 CLANG64)
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          if ! out=$(bash build.sh 2>&1); then
            printf '%s\n' "$out" | tail -30 | while IFS= read -r line; do
              echo "::error title=build.sh::${line}"
            done
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
      - name: Compiler errors (only when the build failed)
        if: failure()
        shell: msys2 {0}
        run: |
          # The step above tails build.sh's output, which a failed build fills with CMake
          # warnings; these are the actual compiler errors, short enough to fit in annotations.
          if [[ -f out/gpu-build.log ]]; then
            grep -E "error:" out/gpu-build.log | head -8 | cut -c1-300 | while IFS= read -r line; do
              echo "::error title=compile::${line}"
            done
          fi

      - name: Standalone tests (portable subset of the Linux-only build.sh --test block)
        shell: msys2 {0}
        run: |
          set -e
          try() {
            local what="$1"; shift
            if ! out=$("$@" 2>&1); then
              {
                echo "::error title=standalone-test::$what failed"
                printf '%s\n' "$out" | sed $'s/\x1b\\[[0-9;]*m//g' | tail -20 | \
                  awk '{line=$0; gsub(/%/, "%25", line); gsub(/\r/, "%0D", line); gsub(/\n/, "%0A", line); print "::error title=standalone-test::" line}'
              }
              exit 1
            fi
            printf '%s\n' "$out" | tail -2
          }
          # tests/test_file_mods.c is POSIX-only by construction (its fixture uses /tmp,
          # mkdtemp and symlink) and stays on the Linux/Nix build.sh --test path.
          echo "::notice title=standalone-test::test_file_mods skipped: POSIX fixture (Linux/Nix only)"
          try compile-content clang -std=c11 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror -I. -Isrc tests/test_content.c src/runtime_content.c -o out/content-test
          try content out/content-test
          # Guest mutex/cond handle lifetime (destroyed handles reported, never re-created) and
          # the statistics shared by every guest thread. Plain C11 + pthreads: no GPU, SDL, FFmpeg.
          try compile-mutex-cond clang -std=c11 -O2 -g -Wall -Wextra -Werror -pthread -Isrc tests/test_mutex_cond.c -o out/mutex-cond-test
          try mutex-cond out/mutex-cond-test
          try compile-coroutine-frames clang++ -std=c++20 -O0 -g -Wall -Wextra -Werror tests/test_coroutine_frames.cpp -o out/coroutine-frames-test
          try coroutine-frames out/coroutine-frames-test
          # Upscaler settings + DLSS SR rules: both are plain C++20, no Vulkan or GPU needed.
          try compile-upscaler-support clang++ -std=c++20 -O2 -g -Wall -Wextra -Werror -Igpu/shim -Igpu/shadps4 tests/test_upscaler_support.cpp gpu/shim/bbport_settings.cpp -o out/upscaler-support-test
          try upscaler-support out/upscaler-support-test
          try compile-dlss-sr clang++ -std=c++20 -O2 -g -Wall -Wextra -Werror -Igpu/shim -Igpu/shadps4 tests/test_dlss_sr.cpp gpu/shim/bbport_settings.cpp -o out/dlss-sr-test
          try dlss-sr out/dlss-sr-test
          # Notices make the fact that these binaries ran and passed readable through the API,
          # not only from a log file nobody can download.
          echo "::notice title=standalone-test::upscaler-support-test ran and passed"
          echo "::notice title=standalone-test::dlss-sr-test ran and passed (presets, render sizes, velocity gate, defaults, frame generation)"
          echo "::notice title=standalone-test::coroutine-frames-test ran and passed"
          echo "::notice title=standalone-test::content-test ran and passed"
          echo "::notice title=standalone-test::mutex-cond-test ran and passed (destroyed cond handles reported, statistics race-free)"

      - name: Windows memory characterization (native Win32 APIs)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p out
          log=out/windows-memory-characterization.log
          : > "$log"
          run_checked() {
            local what="$1"; shift
            local output status=0
            output=$("$@" 2>&1) || status=$?
            printf '%s\n' "$output" | tee -a "$log"
            if (( status )); then
              echo "::error title=windows-memory::$what failed with exit $status"
              # One multi-line annotation (GitHub caps annotations per step, so the whole
              # tail must travel in a single %0A-encoded message to stay visible).
              printf '%s\n' "$output" | sed $'s/\x1b\\[[0-9;]*m//g' | tail -60 | \
                awk '{line=$0; gsub(/%/, "%25", line); gsub(/\r/, "%0D", line); printf "%s%%0A", line}'
              echo ""
              return "$status"
            fi
            return 0
          }
          # For PRs, fetch the PR head ref and build an archive of that exact commit; the
          # default checkout is GitHub's synthetic merge commit. Push runs use GITHUB_SHA.
          expected_source_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pr_number='${{ github.event.pull_request.number }}'
            git fetch --no-tags --depth=1 origin "refs/pull/$pr_number/head" 2>&1 | tee -a "$log"
            source_commit=$(git rev-parse FETCH_HEAD)
            if [[ "$source_commit" != "$expected_source_commit" ]]; then
              message="fetched PR source $source_commit differs from expected $expected_source_commit"
              printf 'ERROR: %s\n' "$message" | tee -a "$log" >&2
              echo "::error title=windows-memory::$message"
              exit 1
            fi
          else
            source_commit="$expected_source_commit"
          fi
          source_root=out/windows-memory-source
          mkdir -p "$source_root"
          git archive "$source_commit" | tar -x -C "$source_root"
          echo "TESTED_SOURCE_COMMIT=$source_commit" | tee -a "$log"
          echo "CHECKED_OUT_WORKFLOW_COMMIT=$(git rev-parse HEAD)" | tee -a "$log"
          # This one-TU harness includes production runtime_memory.c from the exact source commit
          # and stubs only its two unrelated project-level references. No GPU/runtime libraries.
          compile_status=0
          run_checked compile clang -std=c11 -O2 -g -Wall -Wextra -Werror -pthread \
            -I"$source_root/src" "$source_root/tests/test_windows_memory.c" -lonecore \
            -o out/windows-memory-test.exe || compile_status=$?
          execute_status=0
          if (( compile_status == 0 )); then
            run_checked execute out/windows-memory-test.exe || execute_status=$?
          fi
          emit_notice() {
            local topic="$1" pattern="$2" text
            text=$(grep -E "$pattern" "$log" | awk 'BEGIN { ORS = " | " } { print }') || true
            if [[ -n "$text" ]]; then
              text=${text% | }
              text=${text//%/%25}
              text=${text//$'\r'/%0D}
              echo "::notice title=windows-memory::$topic: $text"
            fi
          }
          # Keep evidence in a few compact annotations (GitHub limits per-step annotations).
          emit_notice 'CRIT-05' '^(RESULT CRIT-05|NO_COLLISION_PRECHECK |NO_COLLISION_SUMMARY |COLLISION_BLOCKER=|COLLISION_PROBE |TEST_HOOK_RESERVATION_FAILURE |STOP: reserving|Runtime: PS4 address range partially|--- CRIT-05)'
          emit_notice 'CRIT-06 carve' '^(RESULT CRIT-06\.fixture=|PHASE2_RESULT |FIXTURE_(PLACEHOLDER|INITIAL_VIEW|CLEANUP=)|CARVE_(LEFT|MIDDLE|RIGHT|TRACKED_NOACCESS) |--- CRIT-06 section-backed carve)'
          emit_notice 'CRIT-06 gap' '^(RESULT CRIT-06\.gap=|GAP_(LEFT|RIGHT)_DURING_UNMAP |GAP_DIRECTLY_OBSERVED=|--- CRIT-06 direct gap)'
          emit_notice 'CRIT-06 concurrent' '^(RESULT CRIT-06\.concurrent_access=|CONCURRENT_ACCESS_(GATE|ATTEMPT|COMPLETED)=|--- CRIT-06 isolated concurrent access)'
          emit_notice 'CRIT-06 protection' '^(RESULT CRIT-06\.temporary_protection=|TEMP_WRITABLE_PROTECTION=|--- CRIT-06 temporary protection)'
          emit_notice 'harness-failures' '^(FAIL:|--- CRIT|RESULT CRIT-05)'
          emit_notice 'overall' '^(RESULT SUMMARY|PASS: Windows memory)'
          echo "::notice title=windows-memory::tested_source_commit=$source_commit"
          echo "::notice title=windows-memory::workflow_checkout_commit=$(git rev-parse HEAD)"

      - name: Python test suite
        shell: msys2 {0}
        run: |
          if ! out=$(python -m unittest discover -s tests -p 'test_*.py' 2>&1); then
            printf '%s' "$out" | sed $'s/\x1b\\[[0-9;]*m//g' | \
              awk 'BEGIN{ORS=""}
                   /^FAIL:|^ERROR:|AssertionError|CalledProcessError|Traceback|^Ran |^FAILED|^OK/ { cap = 12 }
                   cap > 0 { errs = errs $0 "\n"; cap--; next }
                   END {
                     line = errs
                     gsub(/%/, "%25", line); gsub(/\r/, "%0D", line); gsub(/\n/, "%0A", line)
                     print "::error title=unittest::" line "\n"
                   }'
            exit 1
          fi
          printf '%s\n' "$out" | grep -E '^(OK|FAILED|Ran )'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-memory-characterization
          path: out/windows-memory-characterization.log
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          path: |
            out/bb-probe.exe
            out/bb-gpu-capabilities.exe
            out/bb-play.exe
          if-no-files-found: error
